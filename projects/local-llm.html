    <!-- Speculative Decoding の速度比較。実測した生成速度（tokens/s）で同じ回答を再生する -->
    <figure class="race">
      <p class="race-q">Q. PythonでCSVファイルを読み込み、日付ごとに売上を集計してグラフを保存する関数を書いてください。</p>
      <div class="race-lanes">

          <pre class="race-text" aria-hidden="true"></pre>
          <div class="race-foot">回答完了まで <span class="race-time">0.0</span> 秒</div>
        </div>
        <div class="race-lane is-fast" data-key="fast">
          <div class="race-head"><span class="race-name">Speculative Decoding</span><span class="race-rate"></span></div>
          <pre class="race-text" aria-hidden="true"></pre>

        </div>
      </div>

        <figcaption>実測した生成速度で再生（Qwen3.8-27B / RTX PRO 6000 ×1 / vLLM）</figcaption>

  <script type="application/json" id="race-data">
{"answer": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndef plot_daily_sales(csv_path: str, output_path: str = \"daily_sales.png\") -> None:\n    \"\"\"\n    CSVファイルを読み込み、日付ごとに売上を集計してグラフを保存する。\n\n    Args:\n        csv_path: 読み込むCSVファイルのパス\n        output_path: 保存するグラフのファイルパス\n    \"\"\"\n    df = pd.read_csv(csv_path)\n\n    # 日付列をdatetime型に変換（'date'列を想定）\n    df['date'] = pd.to_datetime(df['date'])\n\n    # 日付ごとに売上を合計\n    daily_sales = df.groupby('date')['sales'].sum().reset_index()\n\n    # グラフ作成\n    plt.figure(figsize=(12, 6))\n    plt.plot(daily_sales['date'], daily_sales['sales'], marker='o', linestyle='-')\n    plt.title('Daily Sales')\n    plt.xlabel('Date')\n    plt.ylabel('Sales')\n    plt.xticks(rotation=45)\n    plt.tight_layout()\n    plt.savefig(output_path)\n    plt.close()", "tokens": 253, "base": 24.5, "fast": 73.2, "bursts": [3, 4, 2, 4, 3, 1, 4, 3, 2, 3]}
  </script>
  <script>
  (() => {
    const D = JSON.parse(document.getElementById('race-data').textContent);
    const fig = document.querySelector('.race');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 回答を実測トークン数で等分して再生する（トークン境界は近似）
    const chars = [...D.answer];
    const tokens = Array.from({ length: D.tokens }, (_, i) =>
      chars.slice(Math.round(i * chars.length / D.tokens), Math.round((i + 1) * chars.length / D.tokens)).join(''));

    const lanes = [...fig.querySelectorAll('.race-lane')].map(el => {
      const fast = el.dataset.key === 'fast';
      const rate = fast ? D.fast : D.base;
      el.querySelector('.race-rate').textContent = rate.toFixed(1) + ' tokens/s';
      // 通常は1トークンずつ、Speculative は数トークンの塊で確定する（平均速度は実測値に合わせる）
      const steps = [];
      let i = 0, t = 0, b = 0;
      while (i < tokens.length) {
        const n = fast ? Math.min(D.bursts[b++ % D.bursts.length], tokens.length - i) : 1;
        t += n / rate; i += n;
        steps.push({ at: t, n });
      }
      return { el, fast, steps, total: t, text: el.querySelector('.race-text'), time: el.querySelector('.race-time') };
    });

    let raf = 0;
    function play() {
      cancelAnimationFrame(raf);
      lanes.forEach(l => {
        l.shown = 0; l.idx = 0;
        l.el.classList.remove('is-done');
        l.text.innerHTML = '<span class="cursor"></span>';
        l.text.classList.remove('is-scrolled');
        l.time.textContent = '0.0';
      });
      if (reduce) {
        lanes.forEach(l => { l.text.textContent = D.answer; l.time.textContent = l.total.toFixed(1); l.el.classList.add('is-done'); });
        return;
      }
      const t0 = performance.now();
      const tick = now => {
        const t = (now - t0) / 1000;
        let running = false;
        lanes.forEach(l => {
          while (l.idx < l.steps.length && l.steps[l.idx].at <= t) {
            const s = l.steps[l.idx++];
            const chunk = tokens.slice(l.shown, l.shown + s.n).join('');
            l.shown += s.n;
            const cursor = l.text.querySelector('.cursor');
            if (l.fast) {
              const span = document.createElement('span');
              span.className = 'burst';
              span.textContent = chunk;
              l.text.insertBefore(span, cursor);
              setTimeout(() => span.classList.add('settled'), 250);
            } else {
              l.text.insertBefore(document.createTextNode(chunk), cursor);
            }
            l.text.scrollTop = l.text.scrollHeight;
            l.text.classList.toggle('is-scrolled', l.text.scrollTop > 0);
          }
          if (l.idx < l.steps.length) {
            running = true;
            l.time.textContent = t.toFixed(1);
          } else if (!l.el.classList.contains('is-done')) {
            l.time.textContent = l.total.toFixed(1);
            l.el.classList.add('is-done');
            l.text.querySelector('.cursor')?.remove();
          }
        });
        if (running) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    }

    fig.querySelector('.race-replay').addEventListener('click', play);
    // 画面に入ったら1回だけ自動再生
    const io = new IntersectionObserver(es => {
      if (es.some(e => e.isIntersecting)) { io.disconnect(); play(); }
    }, { threshold: 0.3 });
    io.observe(fig);
  })();
  </script>
</body>
